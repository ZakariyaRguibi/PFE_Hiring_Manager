<template>
    <!-- Loading -->
    <template if:true={isLoading}>
        <div class="slds-align_absolute-center slds-p-around_large">
            <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
        </div>
    </template>


    <!-- Main content -->
    <template if:true={stageId}>
        <template if:false={isLoading}>
            <!-- Error -->
            <template if:true={error}>
                <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                    <span class="slds-assistive-text">error</span>
                    <p>{error}</p>
                </div>
            </template>

            <lightning-card icon-name="standard:people">
                <span slot="title">{_stageName}</span>

                <div class="slds-card__body">
                    <!-- Tabs -->
                    <div class="slds-tabs_default">
                        <ul class="slds-tabs_default__nav" role="tablist">
                            <li class={activeTabClass} role="presentation" data-tab="active" onclick={handleTabClick}>
                                <a class="slds-tabs_default__link" role="tab" tabindex="0">{activeTabLabel}</a>
                            </li>
                            <li class={waitingTabClass} role="presentation" data-tab="waiting" onclick={handleTabClick}>
                                <a class="slds-tabs_default__link" role="tab" tabindex="-1">{waitingTabLabel}</a>
                            </li>
                        </ul>

                        <!-- ═══ Active Candidates ═══ -->
                        <template if:true={isActiveTab}>
                            <div class="slds-tabs_default__content slds-show" role="tabpanel">
                                <template if:true={hasActive}>
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout slds-no-row-hover">
                                        <thead>
                                            <tr class="slds-line-height_reset">
                                                <th scope="col" style="width:3rem"></th>
                                                <th scope="col"><div class="slds-truncate" title="Candidate">Candidate</div></th>
                                                <th scope="col" style="width:11rem"><div class="slds-truncate" title="Interview">Interview</div></th>
                                                <th scope="col" style="width:9rem"><div class="slds-truncate" title="Interview Score">Interview Score</div></th>
                                                <th scope="col" style="width:9rem"><div class="slds-truncate" title={activeStatusColumnLabel}>{activeStatusColumnLabel}</div></th>
                                                <th scope="col" style="width:13rem"><div class="slds-truncate" title="Actions">Actions</div></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={enrichedActive} for:item="c">
                                                <tr key={c.applicationId} class={c.rowClass} data-appid={c.applicationId} onclick={handleRowClick}>
                                                    <td>
                                                        <lightning-avatar fallback-icon-name="standard:user" initials={c.candidateInitials} size="small" variant="circle"></lightning-avatar>
                                                    </td>
                                                    <td>
                                                        <a data-appid={c.applicationId} onclick={handleNavToApp} class="slds-text-link">{c.candidateName}</a>
                                                        <p class="slds-text-body_small slds-text-color_weak">{c.experienceLabel} &bull; {c.educationLabel}</p>
                                                    </td>
                                                    <td>
                                                        <lightning-badge label={c.interviewStatusLabel} class={c.interviewStatusClass}></lightning-badge>
                                                    </td>
                                                    <td>
                                                        <template if:true={c.scoreLabel}>
                                                            <lightning-badge label={c.scoreLabel} class={c.scoreBadgeClass}></lightning-badge>
                                                        </template>
                                                    </td>
                                                    <td>
                                                        <template if:true={isHiredView}>
                                                            <template if:true={c.stageBadgeLabel}>
                                                                <span class={c.stageBadgeClass}>{c.stageBadgeLabel}</span>
                                                            </template>
                                                        </template>
                                                        <template if:false={isHiredView}>
                                                            <template if:true={c.recommendation}>
                                                                <span class={c.recommendationClass}>{c.recommendation}</span>
                                                            </template>
                                                        </template>
                                                    </td>
                                                    <td>
                                                        <template if:true={isHiredView}>
                                                            <div class="invite-action-cell">
                                                                <template if:true={c.isOffer}>
                                                                    <lightning-button label="Accept" variant="success" size="small" data-appid={c.applicationId} onclick={handleAcceptOffer}></lightning-button>
                                                                    <lightning-button label="Decline" variant="destructive-text" size="small" data-appid={c.applicationId} onclick={handleDeclineOffer}></lightning-button>
                                                                </template>
                                                                <template if:true={c.isHired}>
                                                                    <span class="slds-text-color_weak slds-text-body_small">Hired</span>
                                                                </template>
                                                                <lightning-button-menu alternative-text="More" menu-alignment="auto" icon-size="x-small" variant="border-filled" onclick={handleActionStopProp}>
                                                                    <lightning-menu-item label="View Record" value="view" icon-name="utility:new_window" data-appid={c.applicationId} onclick={handleNavToApp}></lightning-menu-item>
                                                                </lightning-button-menu>
                                                            </div>
                                                        </template>
                                                        <template if:false={isHiredView}>
                                                            <div class="invite-action-cell">
                                                                <template if:false={c.invitationSent}>
                                                                    <lightning-button label="Invite" icon-name="utility:email" data-appid={c.applicationId} onclick={handleInvite}></lightning-button>
                                                                </template>
                                                                <template if:true={c.invitationSent}>
                                                                    <span class="slds-badge invite-sent-badge">Invited</span>
                                                                </template>
                                                                <lightning-button-menu alternative-text="Actions" menu-alignment="auto" icon-size="x-small" variant="border-filled" onclick={handleActionStopProp}>
                                                                    <lightning-menu-item label="Undo Promotion" value="undo" icon-name="utility:undo" data-appid={c.applicationId} onclick={handleUndo}></lightning-menu-item>
                                                                    <lightning-menu-item label="Reject" value="reject" icon-name="utility:ban" data-appid={c.applicationId} onclick={handleOpenReject}></lightning-menu-item>
                                                                    <lightning-menu-item label="View Record" value="view" icon-name="utility:new_window" data-appid={c.applicationId} onclick={handleNavToApp}></lightning-menu-item>
                                                                </lightning-button-menu>
                                                            </div>
                                                        </template>
                                                    </td>
                                                </tr>
                                                <!-- Expanded detail -->
                                                <template if:true={c.isExpanded}>
                                                    <tr key={c.expandedRowKey}>
                                                        <td colspan="6" class="detail-cell">
                                                            <c-tf-candidate-detail-row
                                                                candidate={c}
                                                                all-stages={allStages}
                                                                onnavigate={handleNavToApp}></c-tf-candidate-detail-row>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </template>
                                        </tbody>
                                    </table>
                                </template>
                                <template if:false={hasActive}>
                                    <div class="tab-empty">
                                        <img src={emptyStateImg} alt="" class="tab-empty__art"/>
                                        <h3 class="tab-empty__title">{emptyActiveTitle}</h3>
                                        <p class="tab-empty__text">{emptyActiveText}</p>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- ═══ Waiting List ═══ -->
                        <template if:true={isWaitingTab}>
                            <div class="slds-tabs_default__content slds-show" role="tabpanel">
                                <template if:true={hasWaiting}>
                                    <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_fixed-layout slds-no-row-hover">
                                        <thead>
                                            <tr class="slds-line-height_reset">
                                                <th scope="col" style="width:2.5rem"><div class="slds-truncate" title="Rank">#</div></th>
                                                <th scope="col" style="width:3rem"></th>
                                                <th scope="col"><div class="slds-truncate" title="Candidate">Candidate</div></th>
                                                <th scope="col" style="width:11rem"><div class="slds-truncate" title="Interview">Interview</div></th>
                                                <th scope="col" style="width:7rem"><div class="slds-truncate" title={waitingScoreLabel}>{waitingScoreLabel}</div></th>
                                                <th scope="col" style="width:10rem"><div class="slds-truncate" title="Actions">Actions</div></th>
                                            </tr>
                                        </thead>
                                        <tbody>
                                            <template for:each={visibleWaiting} for:item="c">
                                                <tr key={c.applicationId} class={c.rowClass} data-appid={c.applicationId} onclick={handleRowClick}>
                                                    <td><span class="slds-text-body_small slds-text-color_weak">{c.rank}</span></td>
                                                    <td>
                                                        <lightning-avatar fallback-icon-name="standard:user" initials={c.candidateInitials} size="small" variant="circle"></lightning-avatar>
                                                    </td>
                                                    <td>
                                                        <a data-appid={c.applicationId} onclick={handleNavToApp} class="slds-text-link">{c.candidateName}</a>
                                                        <p class="slds-text-body_small slds-text-color_weak">{c.experienceLabel} &bull; {c.educationLabel}</p>
                                                    </td>
                                                    <td>
                                                        <lightning-badge label={c.interviewStatusLabel} class={c.interviewStatusClass}></lightning-badge>
                                                    </td>
                                                    <td>
                                                        <lightning-badge label={c.scoreLabel} class={c.scoreBadgeClass}></lightning-badge>
                                                    </td>
                                                    <td>
                                                        <lightning-button-group>
                                                            <template if:true={isHiredView}>
                                                                <lightning-button label="Offer" variant="success" size="small" data-appid={c.applicationId} onclick={handleExtendOffer}></lightning-button>
                                                            </template>
                                                            <template if:false={isHiredView}>
                                                                <lightning-button label="Promote" variant="brand" size="small" data-appid={c.applicationId} onclick={handlePromote}></lightning-button>
                                                            </template>
                                                            <lightning-button-menu alternative-text="More" menu-alignment="auto" icon-size="x-small" variant="border-filled" onclick={handleActionStopProp}>
                                                                <lightning-menu-item label="Reject" value="reject" icon-name="utility:ban" data-appid={c.applicationId} onclick={handleOpenReject}></lightning-menu-item>
                                                                <lightning-menu-item label="View Record" value="view" icon-name="utility:new_window" data-appid={c.applicationId} onclick={handleNavToApp}></lightning-menu-item>
                                                            </lightning-button-menu>
                                                        </lightning-button-group>
                                                    </td>
                                                </tr>
                                                <!-- Expanded detail -->
                                                <template if:true={c.isExpanded}>
                                                    <tr key={c.expandedRowKey}>
                                                        <td colspan="6" class="detail-cell">
                                                            <c-tf-candidate-detail-row
                                                                candidate={c}
                                                                all-stages={allStages}
                                                                onnavigate={handleNavToApp}></c-tf-candidate-detail-row>
                                                        </td>
                                                    </tr>
                                                </template>
                                            </template>
                                        </tbody>
                                    </table>
                                    <template if:true={hasMoreWaiting}>
                                        <div class="slds-text-align_center slds-m-top_small slds-m-bottom_small">
                                            <template if:true={isLoadingMore}>
                                                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
                                            </template>
                                            <template if:false={isLoadingMore}>
                                                <lightning-button label={viewAllLabel} variant="base" onclick={handleLoadMoreWaiting}></lightning-button>
                                            </template>
                                        </div>
                                    </template>
                                </template>
                                <template if:false={hasWaiting}>
                                    <div class="tab-empty">
                                        <img src={emptyStateImg} alt="" class="tab-empty__art"/>
                                        <h3 class="tab-empty__title">{emptyWaitingTitle}</h3>
                                        <p class="tab-empty__text">{emptyWaitingText}</p>
                                    </div>
                                </template>
                            </div>
                        </template>
                    </div>
                </div>
            </lightning-card>
        </template>
    </template>



    <!-- Capacity confirmation modal: offer / accept when target is reached -->
    <template if:true={showCapacityModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="capacity-modal-title" class="slds-modal slds-fade-in-open capacity-modal">
            <div class="slds-modal__container capacity-modal__container">
                <header class="slds-modal__header capacity-modal__header">
                    <lightning-button-icon icon-name="utility:close" alternative-text="Close" variant="bare-inverse" class="slds-modal__close" onclick={handleCloseCapacityModal}></lightning-button-icon>
                    <div class="capacity-modal__heading">
                        <span class="capacity-modal__icon">
                            <lightning-icon icon-name="utility:warning" size="small" alternative-text="Warning"></lightning-icon>
                        </span>
                        <div>
                            <h2 id="capacity-modal-title" class="slds-modal__title slds-hyphenate">{capacityModalTitle}</h2>
                            <p class="capacity-modal__subtitle">{capacityModalSubtitle}</p>
                        </div>
                    </div>
                </header>
                <div class="slds-modal__content slds-p-around_medium capacity-modal__content">
                    <div class="capacity-metrics" aria-label="Hiring capacity">
                        <div class="capacity-metric">
                            <span>Desired hires</span>
                            <strong>{capacityDesiredHires}</strong>
                        </div>
                        <div class="capacity-metric">
                            <span>Filled positions</span>
                            <strong>{capacityFilledPositions}</strong>
                        </div>
                        <div class="capacity-metric capacity-metric--zero">
                            <span>Open positions</span>
                            <strong>{capacityOpenPositions}</strong>
                        </div>
                    </div>
                    <p class="capacity-modal__body">{capacityModalBody}</p>
                    <div class="capacity-modal__tip">
                        The Pipeline Actions tab contains the finalization choices for this job: close the remaining pipeline, complete already scheduled interviews before closing, or increase desired hires.
                    </div>
                </div>
                <footer class="slds-modal__footer capacity-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseCapacityModal} disabled={isCapacityActionRunning}></lightning-button>
                    <lightning-button label="ok" onclick={handleGoToPipelineActions} disabled={isCapacityActionRunning} class="slds-m-left_x-small"></lightning-button>
                    <lightning-button label={capacityModalPrimaryLabel} variant="brand" onclick={handleConfirmCapacityAction} disabled={isCapacityActionRunning} class="slds-m-left_x-small"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Pipeline action required modal -->
    <template if:true={showPipelineActionModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="pipeline-action-modal-title" class="slds-modal slds-fade-in-open pipeline-action-modal">
            <div class="slds-modal__container pipeline-action-modal__container">
                <header class="slds-modal__header pipeline-action-modal__header">
                    <lightning-button-icon icon-name="utility:close" alternative-text="Close" variant="bare-inverse" class="slds-modal__close" onclick={handleClosePipelineActionModal}></lightning-button-icon>
                    <div class="pipeline-action-modal__heading">
                        <span class="pipeline-action-modal__icon">
                            <lightning-icon icon-name="utility:warning" size="small" alternative-text="Warning"></lightning-icon>
                        </span>
                        <div>
                            <h2 id="pipeline-action-modal-title" class="slds-modal__title slds-hyphenate">Hiring target reached</h2>
                            <p class="pipeline-action-modal__subtitle">This job has no open positions left.</p>
                        </div>
                    </div>
                </header>
                <div class="slds-modal__content slds-p-around_medium pipeline-action-modal__content">
                    <p class="slds-text-body_regular slds-m-bottom_small">{pipelineActionModalMessage}</p>
                    <div class="pipeline-action-modal__info">
                        Open the <strong>Pipeline Actions</strong> tab on the Job Position page to choose one of the available strategies:
                        close the remaining pipeline, complete already scheduled interviews before closing, or increase desired hires.
                    </div>
                </div>
                <footer class="slds-modal__footer pipeline-action-modal__footer">
                    <lightning-button label="Cancel" onclick={handleClosePipelineActionModal}></lightning-button>
                    <lightning-button label="OK" variant="brand" onclick={handleGoToPipelineActions} class="slds-m-left_x-small"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Promote without completed interview warning modal -->
    <template if:true={showPromoteWarningModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="promote-warning-modal-title" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container promote-warning-modal__container">
                <header class="slds-modal__header promote-warning-modal__header">
                    <lightning-button-icon icon-name="utility:close" alternative-text="Close" variant="bare-inverse" class="slds-modal__close" onclick={handleClosePromoteWarningModal}></lightning-button-icon>
                    <div class="promote-warning-modal__heading">
                        <span class="promote-warning-modal__icon">
                            <lightning-icon icon-name="utility:warning" size="small" alternative-text="Warning"></lightning-icon>
                        </span>
                        <div>
                            <h2 id="promote-warning-modal-title" class="slds-modal__title slds-hyphenate">No completed interview on record</h2>
                            <p class="promote-warning-modal__subtitle">This candidate hasn't been interviewed yet in Salesforce.</p>
                        </div>
                    </div>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p class="slds-text-body_regular slds-m-bottom_small">{promoteWarningBody}</p>
                    <div class="promote-warning-modal__tip">
                        To record an interview that happened outside Salesforce, open the <strong>application record</strong> and fill in the interview details before promoting.
                    </div>
                </div>
                <footer class="slds-modal__footer promote-warning-modal__footer">
                    <lightning-button label="Cancel" onclick={handleClosePromoteWarningModal}></lightning-button>
                    <lightning-button label="Record Interview First" onclick={handleRecordInterviewFirst} class="slds-m-left_x-small"></lightning-button>
                    <lightning-button label="Promote Anyway" variant="brand" onclick={handleConfirmPromoteAnyway} class="slds-m-left_x-small"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Undo promotion confirmation modal (only shown when there are side effects) -->
    <template if:true={showUndoModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="undo-modal-title" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon icon-name="utility:close" alternative-text="Close" variant="bare-inverse" class="slds-modal__close" onclick={handleCloseUndoModal}></lightning-button-icon>
                    <h2 id="undo-modal-title" class="slds-modal__title slds-hyphenate">Undo promotion?</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <p class="slds-text-body_regular slds-m-bottom_small">
                        Undoing this promotion will affect <strong>{undoImpact.candidateName}</strong>.
                        Here is what will happen:
                    </p>
                    <ul class="undo-impact-list slds-m-bottom_medium">
                        <template if:true={undoImpact.hasScheduledInterview}>
                            <li class="undo-impact-item">
                                <lightning-icon icon-name="utility:event" size="x-small" class="slds-m-right_x-small undo-impact-icon"></lightning-icon>
                                <span>The interview scheduled for <strong>{undoFormattedDate}</strong> will be cancelled.</span>
                            </li>
                        </template>
                        <template if:true={undoImpact.invitationSent}>
                            <li class="undo-impact-item">
                                <lightning-icon icon-name="utility:email" size="x-small" class="slds-m-right_x-small undo-impact-icon"></lightning-icon>
                                <span>The candidate was already invited — a cancellation will be recorded for follow-up.</span>
                            </li>
                        </template>
                        <template if:true={undoImpact.hasCompletedInterview}>
                            <li class="undo-impact-item">
                                <lightning-icon icon-name="utility:warning" size="x-small" class="slds-m-right_x-small undo-impact-icon undo-impact-icon--warn"></lightning-icon>
                                <span>A completed interview already exists at this stage. Its score will stay on record.</span>
                            </li>
                        </template>
                        <li class="undo-impact-item">
                            <lightning-icon icon-name="utility:undo" size="x-small" class="slds-m-right_x-small undo-impact-icon"></lightning-icon>
                            <span>The candidate will be returned to the waiting pool.</span>
                        </li>
                    </ul>
                    <lightning-textarea
                        label="Reason for undoing"
                        value={undoReason}
                        placeholder="Briefly explain why you're undoing this promotion..."
                        required
                        onchange={handleUndoReasonChange}>
                    </lightning-textarea>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseUndoModal}></lightning-button>
                    <lightning-button label="Confirm undo" variant="destructive" disabled={isUndoing} onclick={handleConfirmUndo} class="slds-m-left_x-small"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>

    <!-- Reject modal -->
    <template if:true={showRejectModal}>
        <section role="dialog" tabindex="-1" aria-modal="true" aria-labelledby="reject-modal-title" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">
                <header class="slds-modal__header">
                    <lightning-button-icon icon-name="utility:close" alternative-text="Close" variant="bare-inverse" class="slds-modal__close" onclick={handleCloseRejectModal}></lightning-button-icon>
                    <h2 id="reject-modal-title" class="slds-modal__title slds-hyphenate">Reject Candidate</h2>
                </header>
                <div class="slds-modal__content slds-p-around_medium">
                    <lightning-textarea label="Rejection Reason" value={rejectReason} placeholder="Enter the reason for rejection..." required onchange={handleRejectReasonChange}></lightning-textarea>
                </div>
                <footer class="slds-modal__footer">
                    <lightning-button label="Cancel" onclick={handleCloseRejectModal}></lightning-button>
                    <lightning-button label="Reject" variant="destructive" onclick={handleConfirmReject} class="slds-m-left_x-small"></lightning-button>
                </footer>
            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
</template>
